appId: com.audistill.app
productName: Audistill
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!.scratch/*'
  - '!.claude/*'
  - '!docs/*'
  - '!tests/*'
  - '!prototypes/*'
  - '!scripts/*'
  - '!ralph-*'
  - '!CLAUDE.md'
  - '!CONTEXT.md'
  - '!vitest.config.ts'
  - '!components.json'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.node.tsbuildinfo,tsconfig.web.tsbuildinfo}'
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32'
asarUnpack:
  - 'node_modules/ffmpeg-static/ffmpeg'
  - 'node_modules/onnxruntime-node/bin/**'
  - 'node_modules/better-sqlite3/build/**'
extraResources:
  - from: build/native/audistill-capture-helper
    to: native/audistill-capture-helper
afterSign: ./scripts/fix-ad-hoc-signing.cjs
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDocumentsFolderUsageDescription: Application needs access to open audio files.
    NSMicrophoneUsageDescription: Audistill needs microphone access when you include a Microphone Source in a Recording Session.
    NSScreenCaptureUsageDescription: Audistill needs Screen Recording access to capture System Audio in a Recording Session.
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
publish:
  provider: github
  owner: audistill
  repo: audistill
